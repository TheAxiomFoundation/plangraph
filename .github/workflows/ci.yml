name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Typecheck + build + test + pack + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Test, including the packed-package integration
        run: bun run test
        env:
          PLANGRAPH_PACK_ONLINE: "1"
      - run: bun run check
